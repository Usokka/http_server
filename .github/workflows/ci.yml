name: C-Web CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Vérification du formatage (Clang-Format)
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          clang-format --dry-run --Werror *.c *.h

  
  build:
    needs: linting 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Compilation avec le Makefile
        run: |
          make clean
          make
        

      - name: Vérification de l'initialisation de l'environnement
        run: |
          make init
          
          test -d www && test -f www/index.html

  
  security_and_tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Analyse statique avec Cppcheck
        run: |
          sudo apt-get install -y cppcheck
          cppcheck --quiet --enable=warning,performance,portability --error-exitcode=1 .

  integration_tests:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Exécution des tests d'intégration
        run: |
          make test